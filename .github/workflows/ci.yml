name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3npbackend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 3npbackend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --passWithNoTests

  # The Next.js frontend (3npfrontend) is not built here yet. `next build` fails
  # because many components live under pages/, so Next prerenders them as pages
  # and they crash without an AuthProvider. Add a frontend job once those
  # components are moved out of pages/.
